<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cinematic Envelope — 粉色信封翻蓋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+TC:wght@300;400&family=Allura&family=Italianno&family=Parisienne&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* === 影片實測色彩（v15 依 sbs 逐格取樣重校） === */
  :root {
    --paper-bg: #dfc5bf;
    --paper-base: 223, 197, 191;   /* 信封底層 — dusty pink */
    --flap-base:  231, 208, 202;   /* 蓋子 — 亮一級（原版 flap/body ≈ +8%） */
    --text-soft:  rgba(122, 82, 68, 0.62);
    --card-dark:  #533c38;         /* 開啟後暗場（原版取樣 #5a423f，經錄影色偏校正） */
    --seal-blob:  49% 51% 48% 52% / 50% 49% 51% 50%;
  }

  html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--paper-bg);
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100dvh;
  }

  /* ============================================================
     卡片暗場 — 白光退去後的場景（原版：NOS CASAMOS + 名字）
     ============================================================ */
  .card-stage {
    position: absolute; inset: 0;
    background: var(--card-dark);
    z-index: 0;
  }
  .scene.opening .card-stage { animation: cardWarm 1.6s ease 0.58s both; }
  @keyframes cardWarm {
    from { background-color: #533c38; }
    to   { background-color: #6a4f4b; }
  }
  /* 柔光暈 — 對應原版結尾邀請卡藝術圖淡入的光感（藝術圖為內容素材，以光暈代位） */
  .card-glow {
    position: absolute; inset: 0;
    background: radial-gradient(90% 68% at 50% 36%,
      rgba(236, 198, 172, 0.30) 0%,
      rgba(226, 182, 160, 0.12) 45%,
      transparent 72%);
    opacity: 0;
  }
  .scene.opening .card-glow { animation: glowIn 2.2s ease 1.25s both; }
  @keyframes glowIn { from { opacity: 0; } to { opacity: 1; } }
  /* 暗場暈影 */
  .card-stage::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 50% 45%,
      transparent 55%, rgba(30, 16, 12, 0.22) 100%);
  }

  .card-inner {
    position: absolute;
    top: 44%; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 1.2vmin, 10px);
    z-index: 2;
  }
  .card-eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(10px, 2.6vmin, 13px);
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: rgba(233, 213, 206, 0.42);
    opacity: 0;
  }
  .card-names {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.12;
    font-family: 'Italianno', 'Allura', cursive;
    color: rgba(240, 224, 217, 0.88);
  }
  .card-names .name  { font-size: clamp(44px, 12vmin, 66px); opacity: 0; }
  .card-names .amp   { font-size: clamp(22px, 6vmin, 32px); opacity: 0; color: rgba(240,224,217,0.5); }
  .scene.opening .card-eyebrow { animation: textIn 0.55s ease 0.72s both; --o: 1; }
  .scene.opening .name-1 { animation: textIn 0.55s ease 0.84s both; --o: 1; }
  .scene.opening .amp    { animation: textIn 0.55s ease 0.95s both; --o: 1; }
  .scene.opening .name-2 { animation: textIn 0.55s ease 1.04s both; --o: 1; }
  @keyframes textIn {
    from { opacity: 0; transform: translateY(7px); filter: blur(3px); }
    to   { opacity: var(--o, 1); transform: none; filter: blur(0); }
  }

  /* ============================================================
     信封舞台
     ============================================================ */
  .envelope-outer {
    position: absolute; inset: 0;
    z-index: 1;
  }
  .scene.opening .envelope-outer { animation: fadeOut 0.12s linear 0.36s forwards; }
  @keyframes fadeOut { to { opacity: 0; } }

  /* 全信封曝光層 — 原版 tap 後 ~230ms 內整體均勻提亮（body+flap+蠟封一起洗） */
  .env-wash {
    position: absolute; inset: 0;
    background: #f4e0da;
    opacity: 0;
    z-index: 30;
    pointer-events: none;
  }
  .scene.opening .env-wash {
    animation: envWash 0.30s cubic-bezier(0.40, 0.10, 0.70, 0.50) 0.05s forwards;
  }
  @keyframes envWash { to { opacity: 0.68; } }

  .envelope {
    position: relative;
    width: 100%; height: 100%;
    perspective: 1500px;
    transform-style: preserve-3d;
  }

  /* === 信封底層 === */
  .env-body {
    width: 100%; height: 100%;
    position: relative;
    background-color: rgb(var(--paper-base));
    overflow: hidden;
    box-shadow:
      inset 0 0 60px rgba(120, 80, 70, 0.06),
      inset 0 2px 1px rgba(255,240,232,0.10),
      inset 0 -2px 4px rgba(80, 50, 40, 0.10);
  }
  .env-body canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  /* 紙張層次 — 上下漸層 + 中央 V 處微暗 */
  .env-body::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(255,250,245,0.06) 0%,
        rgba(255,250,245,0.03) 30%,
        transparent 46%,
        rgba(60,30,25,0.025) 52%,
        rgba(60,30,25,0.045) 100%),
      linear-gradient(to right,
        rgba(80,40,30,0.020) 0%,
        transparent 22%,
        transparent 78%,
        rgba(80,40,30,0.018) 100%),
      radial-gradient(ellipse at 50% 50%,
        rgba(80,40,30,0.05) 0%,
        transparent 25%);
    z-index: 1; pointer-events: none;
  }

  /* === 蓋子投影（光源左上 → 右側較深；開啟時向摺線收縮溶解） === */
  .flap-shadow {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    transform-origin: 50% 33%;
  }
  .scene.opening .flap-shadow { animation: shadowDissolve 0.34s ease-out 0.02s forwards; }
  @keyframes shadowDissolve {
    to { opacity: 0; transform: scaleY(0.72); }
  }

  /* === V 摺痕 === */
  .fold-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }
  .scene.opening .fold-upper { animation: fadeOut 0.28s ease 0.08s forwards; }

  /* === 蓋子 wrapper（3D 旋轉容器）
     開啟只掀 ~54°，中途已被 bloom 吞掉 — 原版從未露出翻蓋背面 === */
  .env-flap-wrapper {
    position: absolute; inset: 0;
    transform-origin: 50% 0;
    transform-style: preserve-3d;
    z-index: 4;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .scene.opening .env-flap-wrapper {
    animation: flapOpen 0.62s cubic-bezier(0.52, 0.04, 0.55, 0.95) 0.04s forwards;
  }
  @keyframes flapOpen {
    0%   { transform: rotateX(0deg); opacity: 1; }
    62%  { opacity: 1; }
    100% { transform: rotateX(54deg); opacity: 0; }
  }
  .env-flap {
    position: absolute; inset: 0;
    background-color: rgb(var(--flap-base));
    clip-path: polygon(0% 0%, 100% 0%, 100% 33%, 50% 56%, 0% 33%);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .env-flap canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  /* 蓋子靜態明暗 — 光源左上（開啟時不再加深，改由 flap-light 提亮） */
  .env-flap::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.08) 0%,
        transparent 40%,
        rgba(0,0,0,0.035) 70%,
        rgba(0,0,0,0.07) 100%),
      linear-gradient(to bottom,
        transparent 0%,
        rgba(0,0,0,0.025) 44%,
        rgba(0,0,0,0.045) 50%);
    pointer-events: none; z-index: 1;
  }
  /* 蓋子受光提亮層 — 掀起面向光源，越掀越亮（取代舊版錯誤的加深） */
  .flap-light {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(255, 246, 240, 0.95) 0%,
      rgba(255, 242, 235, 0.85) 60%,
      rgba(255, 238, 230, 0.75) 100%);
    opacity: 0;
    z-index: 2;
    pointer-events: none;
  }
  .scene.opening .flap-light { animation: flapBrighten 0.32s ease-in 0.05s forwards; }
  @keyframes flapBrighten { to { opacity: 1; } }

  /* ============================================================
     蠟封 — 掛在信封本體上（不在翻蓋內！）
     原版行為：蠟黏在下層紙上，翻蓋撕開後蠟封字淡出、
     留下無字浮雕壓痕原地不動，隨全場過曝一起洗掉。
     蠟封永不做 3D 旋轉 → 不可能出現鏡像/角度異常。
     ============================================================ */
  .seal {
    position: absolute;
    top: 56%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(94px, 24vmin, 138px);
    height: clamp(94px, 24vmin, 138px);
    cursor: pointer;
    z-index: 10;
  }
  .seal-front {
    position: absolute; inset: 0;
    border-radius: var(--seal-blob);
  }
  .scene.opening .seal-front { animation: sealMelt 0.12s ease-out 0.03s forwards; }
  @keyframes sealMelt { to { opacity: 0; } }
  /* 接觸陰影 — 讓蠟封「貼著紙面」 */
  .seal-front::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: var(--seal-blob);
    box-shadow:
      0 1px 1px rgba(80,40,30,0.14),
      1px 2px 2px rgba(80,40,30,0.10),
      2px 3px 5px rgba(80,40,30,0.10),
      2px 4px 9px rgba(80,40,30,0.06);
    pointer-events: none;
  }
  .seal-disc {
    position: absolute; inset: 0;
    border-radius: var(--seal-blob);
    overflow: hidden;
  }
  .seal-disc canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  .seal-shadow {
    position: absolute; inset: 4px;
    border-radius: 50%;
    box-shadow:
      inset 3px 3px 5px -2px rgba(80,40,30,0.20),
      inset 2px 2px 3px -1px rgba(80,40,30,0.12);
    pointer-events: none; z-index: 3;
  }
  /* 蠟封字 M&J — debossed 凹陷壓印（光源左上） */
  .seal-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Italianno', 'Allura', cursive;
    font-size: clamp(30px, 7.5vmin, 44px);
    color: rgba(85,55,42,0.62);
    line-height: 1;
    letter-spacing: 1px;
    text-shadow:
      -1px -1px 0 rgba(60,30,18,0.55),
      -1px -1px 2px rgba(60,30,18,0.32),
      -0.5px -0.5px 0.5px rgba(60,30,18,0.40),
       0.8px  0.8px 0 rgba(255,240,225,0.45),
       1px  1.5px 1.5px rgba(255,240,225,0.25);
    z-index: 5;
  }
  .seal-pulse {
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(180,140,120,0.32);
    animation: pulse 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.35; }
    50%      { transform: scale(1.14); opacity: 0; }
  }
  .scene.opening .seal-pulse { animation: none; opacity: 0; }

  /* 壓痕 — 蠟封撕開後留在紙上的無字浮雕（原版取樣：僅比周圍暗 ~4%） */
  .seal-imprint {
    position: absolute; inset: 1%;
    border-radius: var(--seal-blob);
    background:
      radial-gradient(circle at 36% 30%,
        rgba(255,246,240,0.50) 0%,
        rgba(255,246,240,0.12) 45%,
        transparent 62%),
      radial-gradient(circle at 60% 68%,
        rgba(120,72,58,0.08) 30%,
        rgba(120,72,58,0.13) 78%,
        rgba(120,72,58,0.17) 100%);
    box-shadow:
      inset 2px 3px 6px rgba(255,248,242,0.55),
      inset -2px -3px 7px rgba(130,80,64,0.20),
      1px 2px 5px rgba(130,80,64,0.16);
    opacity: 0;
    pointer-events: none;
  }
  .scene.opening .seal-imprint { animation: imprintIn 0.16s ease-out 0.04s forwards; }
  @keyframes imprintIn { to { opacity: 1; } }

  /* === 副標題（原版為連筆手寫體，位於 ~72% 高） === */
  .env-text {
    position: fixed;
    top: 71%; left: 0; right: 0;
    text-align: center;
    color: var(--text-soft);
    font-family: 'Parisienne', 'Cormorant Garamond', cursive;
    font-weight: 400;
    font-size: clamp(17px, 4.6vmin, 22px);
    letter-spacing: 0.3px;
    line-height: 1.7;
    z-index: 6;
    pointer-events: none;
  }
  .scene.opening .env-text { animation: fadeOut 0.30s ease 0.05s forwards; }

  /* ============================================================
     曝光洗白層 — 原版的核心 cinematic 手法。
     峰值不是純白，是「紙色 +8~10%、所有對比歸零」的暖粉白。
     bloomIn 蓋住翻蓋中段與場景切換，bloomOut 揭開暗場。
     ============================================================ */
  .bloom {
    position: fixed; inset: 0;
    background: radial-gradient(130% 100% at 50% 40%,
      #f8e9e3 0%,
      #f4e0da 60%,
      #efd8d2 100%);
    opacity: 0;
    z-index: 20;
    pointer-events: none;
  }
  .scene.opening .bloom {
    animation:
      bloomIn  0.30s cubic-bezier(0.55, 0.06, 0.68, 0.53) 0.06s forwards,
      bloomOut 0.10s cubic-bezier(0.55, 0.06, 0.55, 0.95) 0.52s forwards;
  }
  @keyframes bloomIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bloomOut { from { opacity: 1; } to { opacity: 0; } }

  /* === 重播按鈕 === */
  .reset-btn {
    position: fixed;
    bottom: 24px; right: 24px;
    background: rgba(60, 40, 34, 0.40);
    color: #f5e8e2;
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 8px 16px;
    border-radius: 22px;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 100;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 2.0s;
  }
  .scene.opening .reset-btn {
    opacity: 0.5;
    pointer-events: auto;
  }
  .reset-btn:hover { opacity: 1; }
</style>
</head>
<body>

<div class="scene" id="scene">
  <!-- 開啟後的卡片暗場 -->
  <div class="card-stage">
    <div class="card-glow"></div>
    <div class="card-inner">
      <div class="card-eyebrow">Nos casamos</div>
      <div class="card-names">
        <span class="name name-1">Mar</span>
        <span class="amp">&amp;</span>
        <span class="name name-2">Jaume</span>
      </div>
    </div>
  </div>

  <!-- 信封舞台 -->
  <div class="envelope-outer">
    <div class="envelope">
      <!-- 信封底層 -->
      <div class="env-body">
        <canvas id="envTex"></canvas>
      </div>

      <!-- 蓋子投影 -->
      <svg class="flap-shadow" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="flapShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.6"/>
          </filter>
          <linearGradient id="flapShadowGrad" x1="0" y1="0" x2="1" y2="0.25">
            <stop offset="0%"   stop-color="rgba(90,45,30,0.10)"/>
            <stop offset="45%"  stop-color="rgba(90,45,30,0.22)"/>
            <stop offset="100%" stop-color="rgba(90,45,30,0.38)"/>
          </linearGradient>
          <linearGradient id="flapShadowFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="white"/>
            <stop offset="70%" stop-color="white" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
          </linearGradient>
          <mask id="flapShadowMask">
            <polygon points="0,33 100,33 50,56" fill="url(#flapShadowFade)"
                     transform="translate(0,1.2)"/>
          </mask>
        </defs>
        <polygon points="0,33 100,33 50,56"
                 transform="translate(0,1.2)"
                 fill="url(#flapShadowGrad)"
                 filter="url(#flapShadowBlur)"
                 mask="url(#flapShadowMask)"/>
      </svg>

      <!-- V 摺痕 -->
      <svg class="fold-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="foldBlur"><feGaussianBlur stdDeviation="0.15"/></filter>
          <filter id="foldShadow"><feGaussianBlur stdDeviation="0.4"/></filter>
        </defs>
        <g class="fold-upper">
          <line x1="-20" y1="23.8" x2="50" y2="56"
                stroke="rgba(60,30,20,0.14)" stroke-width="2.0" filter="url(#foldShadow)"/>
          <line x1="120" y1="23.8" x2="50" y2="56"
                stroke="rgba(60,30,20,0.12)" stroke-width="1.6" filter="url(#foldShadow)"/>
          <line x1="-20" y1="23.8" x2="50" y2="56"
                stroke="rgba(60,30,20,0.24)" stroke-width="0.55" filter="url(#foldBlur)"/>
          <line x1="120" y1="23.8" x2="50" y2="56"
                stroke="rgba(60,30,20,0.22)" stroke-width="0.5" filter="url(#foldBlur)"/>
          <line x1="-20" y1="23.3" x2="50.2" y2="55.5"
                stroke="rgba(255,240,225,0.18)" stroke-width="0.35"/>
          <line x1="120" y1="23.3" x2="49.8" y2="55.5"
                stroke="rgba(255,240,225,0.15)" stroke-width="0.3"/>
        </g>
        <g class="fold-lower">
          <line x1="-20" y1="90.2" x2="50" y2="56"
                stroke="rgba(60,30,20,0.09)" stroke-width="1.1" filter="url(#foldShadow)"/>
          <line x1="120" y1="90.2" x2="50" y2="56"
                stroke="rgba(60,30,20,0.08)" stroke-width="0.95" filter="url(#foldShadow)"/>
          <line x1="-20" y1="90.2" x2="50" y2="56"
                stroke="rgba(60,30,20,0.12)" stroke-width="0.32" filter="url(#foldBlur)"/>
          <line x1="120" y1="90.2" x2="50" y2="56"
                stroke="rgba(60,30,20,0.11)" stroke-width="0.28" filter="url(#foldBlur)"/>
          <line x1="-20" y1="90.6" x2="50.2" y2="56.4"
                stroke="rgba(255,240,225,0.12)" stroke-width="0.25"/>
          <line x1="120" y1="90.6" x2="49.8" y2="56.4"
                stroke="rgba(255,240,225,0.10)" stroke-width="0.22"/>
        </g>
      </svg>

      <!-- 上蓋 -->
      <div class="env-flap-wrapper">
        <div class="env-flap">
          <canvas id="flapTex"></canvas>
          <div class="flap-light"></div>
        </div>
      </div>

      <!-- 全信封曝光層 -->
      <div class="env-wash"></div>

      <!-- 蠟封（本體層，位於翻蓋之上） -->
      <div class="seal" id="seal">
        <div class="seal-imprint"></div>
        <div class="seal-front">
          <div class="seal-pulse"></div>
          <div class="seal-disc">
            <canvas id="sealTex"></canvas>
            <div class="seal-shadow"></div>
            <div class="seal-text">M &amp; J</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="env-text">Esta invitación es<br>exclusiva para ti</div>

  <!-- 曝光洗白層 -->
  <div class="bloom"></div>

  <button class="reset-btn" id="resetBtn" onclick="resetScene()">↻ 重播</button>
</div>

<script>
  // ========= 粉色紙張紋理 =========
  function makePaperTexture(canvas, w, h, baseR, baseG, baseB) {
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
    ctx.fillRect(0, 0, w, h);

    const g = ctx.createLinearGradient(0, 0, w * 0.4, h);
    g.addColorStop(0, 'rgba(255,255,255,0.04)');
    g.addColorStop(1, 'rgba(0,0,0,0.025)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    // 噪點
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 22;
      d[i] += n; d[i+1] += n; d[i+2] += n;
    }
    // 纖維線
    for (let f = 0; f < 1100; f++) {
      const fx = Math.random() * w, fy = Math.random() * h;
      const len = 8 + Math.random() * 35;
      const br = (Math.random() - 0.5) * 16;
      for (let p = 0; p < len; p++) {
        const px = Math.floor(fx + p + (Math.random() - 0.5) * 2);
        const py = Math.floor(fy + (Math.random() - 0.5) * 1.5);
        if (px >= 0 && px < w && py >= 0 && py < h) {
          const idx = (py * w + px) * 4;
          d[idx] += br; d[idx+1] += br; d[idx+2] += br;
        }
      }
    }
    // 不規則斑塊
    for (let b = 0; b < 45; b++) {
      const bx = Math.random() * w, by = Math.random() * h;
      const bR = 12 + Math.random() * 36;
      const bBr = (Math.random() - 0.5) * 9;
      for (let dy = -bR; dy < bR; dy++) {
        for (let dx = -bR; dx < bR; dx++) {
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < bR) {
            const px = Math.floor(bx + dx), py = Math.floor(by + dy);
            if (px >= 0 && px < w && py >= 0 && py < h) {
              const falloff = 1 - dist / bR;
              const idx = (py * w + px) * 4;
              const v = bBr * falloff * falloff;
              d[idx] += v; d[idx+1] += v; d[idx+2] += v;
            }
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // ========= 蠟封紋理（裸粉色） =========
  function makeWaxSeal() {
    const c = document.getElementById('sealTex');
    const size = 200;
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const cx = size/2, cy = size/2, r = size/2;

    // 圓頂光照漸層 — 裸粉色蠟
    const base = ctx.createRadialGradient(
      cx - r*0.3, cy - r*0.35, r*0.05,
      cx + r*0.1, cy + r*0.2,  r*1.1
    );
    base.addColorStop(0,    '#e6cabf');
    base.addColorStop(0.35, '#dabbb0');
    base.addColorStop(0.70, '#caa89c');
    base.addColorStop(0.90, '#bd998a');
    base.addColorStop(1,    '#ae8b79');
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();

    // 細微蠟面紋理
    const img = ctx.getImageData(0, 0, size, size);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const px = (i/4) % size, py = Math.floor((i/4) / size);
      const dist = Math.sqrt((px-cx)**2 + (py-cy)**2);
      if (dist > r) continue;
      const n = (Math.random() - 0.5) * 8;
      const warm = (Math.random() - 0.5) * 3;
      d[i] += n + warm; d[i+1] += n; d[i+2] += n - warm;
    }
    // 小顆粒
    for (let g = 0; g < 140; g++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * r * 0.85;
      const gx = Math.floor(cx + Math.cos(angle) * dist);
      const gy = Math.floor(cy + Math.sin(angle) * dist);
      if (gx >= 0 && gx < size && gy >= 0 && gy < size) {
        const idx = (gy * size + gx) * 4;
        const v = (Math.random() - 0.5) * 6;
        d[idx] += v; d[idx+1] += v; d[idx+2] += v;
      }
    }
    ctx.putImageData(img, 0, 0);

    // 邊緣暗化（柔和）
    ctx.globalCompositeOperation = 'source-atop';
    const edge = ctx.createRadialGradient(
      cx - r*0.18, cy - r*0.18, r*0.55,
      cx + r*0.05, cy + r*0.05, r
    );
    edge.addColorStop(0, 'transparent');
    edge.addColorStop(0.4, 'rgba(0,0,0,0.018)');
    edge.addColorStop(0.7, 'rgba(0,0,0,0.06)');
    edge.addColorStop(0.88, 'rgba(0,0,0,0.12)');
    edge.addColorStop(1, 'rgba(0,0,0,0.20)');
    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, size, size);

    // 盤面壓暗
    const dish = ctx.createRadialGradient(cx, cy, 0, cx, cy, r*0.72);
    dish.addColorStop(0, 'rgba(0,0,0,0.08)');
    dish.addColorStop(0.7, 'rgba(0,0,0,0.06)');
    dish.addColorStop(1, 'transparent');
    ctx.fillStyle = dish;
    ctx.fillRect(0, 0, size, size);

    // 凸環
    const rimOuter = ctx.createRadialGradient(cx, cy, r*0.74, cx, cy, r*0.86);
    rimOuter.addColorStop(0, 'transparent');
    rimOuter.addColorStop(0.2, 'rgba(255,240,225,0.12)');
    rimOuter.addColorStop(0.4, 'rgba(255,240,225,0.22)');
    rimOuter.addColorStop(0.6, 'rgba(255,240,225,0.22)');
    rimOuter.addColorStop(0.8, 'rgba(255,240,225,0.09)');
    rimOuter.addColorStop(1, 'transparent');
    ctx.fillStyle = rimOuter;
    ctx.fillRect(0, 0, size, size);

    // 凸環內側陰影
    const rimInner = ctx.createRadialGradient(cx, cy, r*0.66, cx, cy, r*0.75);
    rimInner.addColorStop(0, 'transparent');
    rimInner.addColorStop(0.4, 'rgba(0,0,0,0.06)');
    rimInner.addColorStop(0.7, 'rgba(0,0,0,0.10)');
    rimInner.addColorStop(1, 'transparent');
    ctx.fillStyle = rimInner;
    ctx.fillRect(0, 0, size, size);
  }

  // ========= 初始化 =========
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sw = Math.ceil(window.innerWidth * dpr);
  const sh = Math.ceil(window.innerHeight * dpr);
  makePaperTexture(document.getElementById('envTex'),  sw, sh, 223, 197, 191);
  makePaperTexture(document.getElementById('flapTex'), sw, sh, 231, 208, 202);
  makeWaxSeal();

  // ========= 互動 =========
  const scene = document.getElementById('scene');
  const seal  = document.getElementById('seal');

  function openEnvelope() {
    if (scene.classList.contains('opening')) return;
    scene.classList.add('opening');
  }
  window.openEnvelope = openEnvelope;

  function resetScene() {
    scene.classList.remove('opening');
  }

  seal.addEventListener('click', e => {
    e.stopPropagation();
    openEnvelope();
  });

  // ========= Test hooks =========
  // ?auto        — 載入後自動開啟
  // ?seek=N      — 自動開啟並將所有動畫定格在第 N 毫秒（確定性抽格比對用）
  const params = new URLSearchParams(location.search);
  const seekMs = parseFloat(params.get('seek') || params.get('freeze') || '0');
  const autoOpen = params.has('auto') || seekMs > 0;

  if (autoOpen) setTimeout(() => openEnvelope(), 60);
  if (seekMs > 0) {
    setTimeout(() => {
      document.getAnimations().forEach(a => {
        a.pause();
        a.currentTime = seekMs;
      });
    }, 140);
  }
</script>
</body>
</html>
