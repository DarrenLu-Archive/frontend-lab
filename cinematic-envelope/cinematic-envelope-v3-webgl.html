<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cinematic Envelope v3 — WebGL 法線貼圖打光</title>
<!-- 完全自足單一檔案：OGL 與貼圖已內嵌，直接雙擊（file://）即可開啟。
     架構：互動與 v2 級視覺用普通 script 立即生效；WebGL 增強層獨立執行，失敗自動留在 v2 視覺。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+TC:wght@300;400&family=Allura&family=Italianno&family=Parisienne&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* === 影片實測色彩（沿用 v2 逐格取樣校準值） === */
  :root {
    --paper-bg: #dfc5bf;
    --paper-base: 223, 197, 191;
    --flap-base:  231, 208, 202;
    --text-soft:  rgba(122, 82, 68, 0.62);
    --card-dark:  #533c38;
    --seal-blob:  49% 51% 48% 52% / 50% 49% 51% 50%;
  }

  html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--paper-bg);
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene { position: relative; width: 100vw; height: 100dvh; }

  /* ============================================================
     卡片暗場（沿用 v2 逐格對齊的時間軸）
     ============================================================ */
  .card-stage { position: absolute; inset: 0; background: var(--card-dark); z-index: 0; }
  .scene.opening .card-stage { animation: cardWarm 1.6s ease 0.58s both; }
  @keyframes cardWarm { from { background-color: #533c38; } to { background-color: #6a4f4b; } }
  .card-glow {
    position: absolute; inset: 0;
    background: radial-gradient(90% 68% at 50% 36%,
      rgba(236, 198, 172, 0.30) 0%, rgba(226, 182, 160, 0.12) 45%, transparent 72%);
    opacity: 0;
  }
  .scene.opening .card-glow { animation: glowIn 2.2s ease 1.25s both; }
  @keyframes glowIn { from { opacity: 0; } to { opacity: 1; } }
  .card-stage::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(30, 16, 12, 0.22) 100%);
  }
  .card-inner {
    position: absolute; top: 44%; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(4px, 1.2vmin, 10px); z-index: 2;
  }
  .card-eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(10px, 2.6vmin, 13px);
    letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase;
    color: rgba(233, 213, 206, 0.42);
    opacity: 0;
  }
  .card-names {
    display: flex; flex-direction: column; align-items: center;
    line-height: 1.12;
    font-family: 'Italianno', 'Allura', cursive;
    color: rgba(240, 224, 217, 0.88);
  }
  .card-names .name { font-size: clamp(44px, 12vmin, 66px); opacity: 0; }
  .card-names .amp  { font-size: clamp(22px, 6vmin, 32px); opacity: 0; color: rgba(240,224,217,0.5); }
  .scene.opening .card-eyebrow { animation: textIn 0.55s ease 0.72s both; --o: 1; }
  .scene.opening .name-1 { animation: textIn 0.55s ease 0.84s both; --o: 1; }
  .scene.opening .amp    { animation: textIn 0.55s ease 0.95s both; --o: 1; }
  .scene.opening .name-2 { animation: textIn 0.55s ease 1.04s both; --o: 1; }
  @keyframes textIn {
    from { opacity: 0; transform: translateY(7px); filter: blur(3px); }
    to   { opacity: var(--o, 1); transform: none; filter: blur(0); }
  }

  /* ============================================================
     信封舞台
     ============================================================ */
  .envelope-outer { position: absolute; inset: 0; z-index: 1; }
  .scene.opening .envelope-outer { animation: fadeOut 0.12s linear 0.36s forwards; }
  @keyframes fadeOut { to { opacity: 0; } }

  .env-wash {
    position: absolute; inset: 0;
    background: #f4e0da;
    opacity: 0; z-index: 30; pointer-events: none;
  }
  .scene.opening .env-wash { animation: envWash 0.30s cubic-bezier(0.40, 0.10, 0.70, 0.50) 0.05s forwards; }
  @keyframes envWash { to { opacity: 0.68; } }

  .envelope {
    position: relative; width: 100%; height: 100%;
    perspective: 1500px;
    transform-style: preserve-3d;
  }

  .env-body {
    width: 100%; height: 100%;
    position: relative;
    background-color: rgb(var(--paper-base));
    overflow: hidden;
    box-shadow:
      inset 0 0 60px rgba(120, 80, 70, 0.06),
      inset 0 2px 1px rgba(255,240,232,0.10),
      inset 0 -2px 4px rgba(80, 50, 40, 0.10);
  }
  .env-body canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .env-body::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(255,250,245,0.06) 0%, rgba(255,250,245,0.03) 30%, transparent 46%,
        rgba(60,30,25,0.025) 52%, rgba(60,30,25,0.045) 100%),
      linear-gradient(to right,
        rgba(80,40,30,0.020) 0%, transparent 22%, transparent 78%, rgba(80,40,30,0.018) 100%),
      radial-gradient(ellipse at 50% 50%, rgba(80,40,30,0.05) 0%, transparent 25%);
    z-index: 1; pointer-events: none;
  }

  .flap-shadow {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
    transform-origin: 50% 33%;
  }
  .scene.opening .flap-shadow { animation: shadowDissolve 0.34s ease-out 0.02s forwards; }
  @keyframes shadowDissolve { to { opacity: 0; transform: scaleY(0.72); } }

  .fold-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  .scene.opening .fold-upper { animation: fadeOut 0.28s ease 0.08s forwards; }

  .env-flap-wrapper {
    position: absolute; inset: 0;
    transform-origin: 50% 0;
    transform-style: preserve-3d;
    z-index: 4;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .scene.opening .env-flap-wrapper { animation: flapOpen 0.62s cubic-bezier(0.52, 0.04, 0.55, 0.95) 0.04s forwards; }
  @keyframes flapOpen {
    0%   { transform: rotateX(0deg); opacity: 1; }
    62%  { opacity: 1; }
    100% { transform: rotateX(54deg); opacity: 0; }
  }
  .env-flap {
    position: absolute; inset: 0;
    background-color: rgb(var(--flap-base));
    clip-path: polygon(0% 0%, 100% 0%, 100% 33%, 50% 56%, 0% 33%);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .env-flap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 翻蓋雙 canvas：#flapTex = 2D 備援與初始畫面；#flapGL = WebGL 即時光照，就緒後才顯示 */
  #flapGL { display: none; }
  .scene.glr #flapGL { display: block; }
  .env-flap::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.08) 0%, transparent 40%, rgba(0,0,0,0.035) 70%, rgba(0,0,0,0.07) 100%),
      linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.025) 44%, rgba(0,0,0,0.045) 50%);
    pointer-events: none; z-index: 1;
  }
  .flap-light {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(255, 246, 240, 0.55) 0%, rgba(255, 242, 235, 0.45) 60%, rgba(255, 238, 230, 0.38) 100%);
    opacity: 0; z-index: 2; pointer-events: none;
  }
  .scene.opening .flap-light { animation: flapBrighten 0.32s ease-in 0.05s forwards; }
  @keyframes flapBrighten { to { opacity: 1; } }

  /* ============================================================
     蠟封 — WebGL 烘焙浮雕；WebGL 失敗時退回 v2 的 2D 畫法＋文字陰影
     ============================================================ */
  .seal {
    position: absolute;
    top: 56%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(94px, 24vmin, 138px);
    height: clamp(94px, 24vmin, 138px);
    cursor: pointer;
    z-index: 10;
  }
  .seal-front { position: absolute; inset: 0; border-radius: var(--seal-blob); }
  .scene.opening .seal-front { animation: sealMelt 0.12s ease-out 0.03s forwards; }
  @keyframes sealMelt { to { opacity: 0; } }
  .seal-front::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: var(--seal-blob);
    box-shadow:
      0 1px 1px rgba(80,40,30,0.14),
      1px 2px 2px rgba(80,40,30,0.10),
      2px 3px 5px rgba(80,40,30,0.10),
      2px 4px 9px rgba(80,40,30,0.06);
    pointer-events: none;
  }
  .seal-disc { position: absolute; inset: 0; border-radius: var(--seal-blob); overflow: hidden; }
  .seal-disc canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* v2 備援用的內陰影與壓印文字 — WebGL 就緒後隱藏（改由浮雕渲染呈現） */
  .seal-shadow {
    position: absolute; inset: 4px;
    border-radius: 50%;
    box-shadow:
      inset 3px 3px 5px -2px rgba(80,40,30,0.20),
      inset 2px 2px 3px -1px rgba(80,40,30,0.12);
    pointer-events: none; z-index: 3;
  }
  .seal-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Italianno', 'Allura', cursive;
    font-size: clamp(30px, 7.5vmin, 44px);
    color: rgba(85,55,42,0.62);
    line-height: 1;
    letter-spacing: 1px;
    text-shadow:
      -1px -1px 0 rgba(60,30,18,0.55),
      -1px -1px 2px rgba(60,30,18,0.32),
      -0.5px -0.5px 0.5px rgba(60,30,18,0.40),
       0.8px  0.8px 0 rgba(255,240,225,0.45),
       1px  1.5px 1.5px rgba(255,240,225,0.25);
    z-index: 5;
  }
  .scene.glr .seal-text, .scene.glr .seal-shadow { display: none; }
  .seal-pulse {
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(180,140,120,0.32);
    animation: pulse 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.35; }
    50%      { transform: scale(1.14); opacity: 0; }
  }
  .scene.opening .seal-pulse { animation: none; opacity: 0; }

  /* 壓痕 — 備援：v2 漸層；WebGL 就緒後改由浮雕 canvas 呈現 */
  .seal-imprint {
    position: absolute; inset: 1%;
    border-radius: var(--seal-blob);
    overflow: hidden;
    background:
      radial-gradient(circle at 36% 30%,
        rgba(255,246,240,0.50) 0%, rgba(255,246,240,0.12) 45%, transparent 62%),
      radial-gradient(circle at 60% 68%,
        rgba(120,72,58,0.08) 30%, rgba(120,72,58,0.13) 78%, rgba(120,72,58,0.17) 100%);
    box-shadow:
      inset 2px 3px 6px rgba(255,248,242,0.40),
      inset -2px -3px 7px rgba(130,80,64,0.15),
      1px 2px 5px rgba(130,80,64,0.12);
    opacity: 0;
    pointer-events: none;
  }
  .scene.glr .seal-imprint { background: none; }
  .seal-imprint canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene.opening .seal-imprint { animation: imprintIn 0.16s ease-out 0.04s forwards; }
  @keyframes imprintIn { to { opacity: 1; } }

  .env-text {
    position: fixed;
    top: 71%; left: 0; right: 0;
    text-align: center;
    color: var(--text-soft);
    font-family: 'Parisienne', 'Cormorant Garamond', cursive;
    font-weight: 400;
    font-size: clamp(17px, 4.6vmin, 22px);
    letter-spacing: 0.3px; line-height: 1.7;
    z-index: 6; pointer-events: none;
  }
  .scene.opening .env-text { animation: fadeOut 0.30s ease 0.05s forwards; }

  .bloom {
    position: fixed; inset: 0;
    background: radial-gradient(130% 100% at 50% 40%,
      #f8e9e3 0%, #f4e0da 60%, #efd8d2 100%);
    opacity: 0; z-index: 20; pointer-events: none;
  }
  .scene.opening .bloom {
    animation:
      bloomIn  0.30s cubic-bezier(0.55, 0.06, 0.68, 0.53) 0.06s forwards,
      bloomOut 0.10s cubic-bezier(0.55, 0.06, 0.55, 0.95) 0.52s forwards;
  }
  @keyframes bloomIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bloomOut { from { opacity: 1; } to { opacity: 0; } }

  .reset-btn {
    position: fixed;
    bottom: 24px; right: 24px;
    background: rgba(60, 40, 34, 0.40);
    color: #f5e8e2;
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 8px 16px;
    border-radius: 22px;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 100;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 2.0s;
  }
  .scene.opening .reset-btn { opacity: 0.5; pointer-events: auto; }
  .reset-btn:hover { opacity: 1; }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="card-stage">
    <div class="card-glow"></div>
    <div class="card-inner">
      <div class="card-eyebrow">Nos casamos</div>
      <div class="card-names">
        <span class="name name-1">Mar</span>
        <span class="amp">&amp;</span>
        <span class="name name-2">Jaume</span>
      </div>
    </div>
  </div>

  <div class="envelope-outer">
    <div class="envelope">
      <div class="env-body">
        <canvas id="envTex"></canvas>
      </div>

      <svg class="flap-shadow" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="flapShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.6"/>
          </filter>
          <linearGradient id="flapShadowGrad" x1="0" y1="0" x2="1" y2="0.25">
            <stop offset="0%"   stop-color="rgba(90,45,30,0.10)"/>
            <stop offset="45%"  stop-color="rgba(90,45,30,0.22)"/>
            <stop offset="100%" stop-color="rgba(90,45,30,0.38)"/>
          </linearGradient>
          <linearGradient id="flapShadowFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="white"/>
            <stop offset="70%" stop-color="white" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
          </linearGradient>
          <mask id="flapShadowMask">
            <polygon points="0,33 100,33 50,56" fill="url(#flapShadowFade)" transform="translate(0,1.2)"/>
          </mask>
        </defs>
        <polygon points="0,33 100,33 50,56"
                 transform="translate(0,1.2)"
                 fill="url(#flapShadowGrad)"
                 filter="url(#flapShadowBlur)"
                 mask="url(#flapShadowMask)"/>
      </svg>

      <svg class="fold-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="foldBlur"><feGaussianBlur stdDeviation="0.15"/></filter>
          <filter id="foldShadow"><feGaussianBlur stdDeviation="0.4"/></filter>
        </defs>
        <g class="fold-upper">
          <line x1="-20" y1="23.8" x2="50" y2="56" stroke="rgba(60,30,20,0.14)" stroke-width="2.0" filter="url(#foldShadow)"/>
          <line x1="120" y1="23.8" x2="50" y2="56" stroke="rgba(60,30,20,0.12)" stroke-width="1.6" filter="url(#foldShadow)"/>
          <line x1="-20" y1="23.8" x2="50" y2="56" stroke="rgba(60,30,20,0.24)" stroke-width="0.55" filter="url(#foldBlur)"/>
          <line x1="120" y1="23.8" x2="50" y2="56" stroke="rgba(60,30,20,0.22)" stroke-width="0.5" filter="url(#foldBlur)"/>
          <line x1="-20" y1="23.3" x2="50.2" y2="55.5" stroke="rgba(255,240,225,0.18)" stroke-width="0.35"/>
          <line x1="120" y1="23.3" x2="49.8" y2="55.5" stroke="rgba(255,240,225,0.15)" stroke-width="0.3"/>
        </g>
        <g class="fold-lower">
          <line x1="-20" y1="90.2" x2="50" y2="56" stroke="rgba(60,30,20,0.09)" stroke-width="1.1" filter="url(#foldShadow)"/>
          <line x1="120" y1="90.2" x2="50" y2="56" stroke="rgba(60,30,20,0.08)" stroke-width="0.95" filter="url(#foldShadow)"/>
          <line x1="-20" y1="90.2" x2="50" y2="56" stroke="rgba(60,30,20,0.12)" stroke-width="0.32" filter="url(#foldBlur)"/>
          <line x1="120" y1="90.2" x2="50" y2="56" stroke="rgba(60,30,20,0.11)" stroke-width="0.28" filter="url(#foldBlur)"/>
          <line x1="-20" y1="90.6" x2="50.2" y2="56.4" stroke="rgba(255,240,225,0.12)" stroke-width="0.25"/>
          <line x1="120" y1="90.6" x2="49.8" y2="56.4" stroke="rgba(255,240,225,0.10)" stroke-width="0.22"/>
        </g>
      </svg>

      <div class="env-flap-wrapper">
        <div class="env-flap">
          <canvas id="flapTex"></canvas>
          <canvas id="flapGL"></canvas>
          <div class="flap-light"></div>
        </div>
      </div>

      <div class="env-wash"></div>

      <div class="seal" id="seal" aria-label="蠟封 M & J — 點擊開啟">
        <div class="seal-imprint"><canvas id="imprintTex"></canvas></div>
        <div class="seal-front">
          <div class="seal-pulse"></div>
          <div class="seal-disc">
            <canvas id="sealTex"></canvas>
            <div class="seal-shadow"></div>
            <div class="seal-text">M &amp; J</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="env-text">Esta invitación es<br>exclusiva para ti</div>

  <div class="bloom"></div>

  <button class="reset-btn" id="resetBtn">↻ 重播</button>
</div>

<script>
/* ================================================================
   第一層（保證能動）：互動 + v2 級 2D 視覺。
   不依賴 WebGL、不依賴外部資源 — file:// 雙擊即可完整運作。
   ================================================================ */

// ---------- v2 的 2D 紙張紋理（先畫上，WebGL 就緒後被覆蓋） ----------
function makePaperTexture(canvas, w, h, baseR, baseG, baseB) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
  ctx.fillRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, w * 0.4, h);
  g.addColorStop(0, 'rgba(255,255,255,0.04)');
  g.addColorStop(1, 'rgba(0,0,0,0.025)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 22;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  for (let f = 0; f < 1100; f++) {
    const fx = Math.random() * w, fy = Math.random() * h;
    const len = 8 + Math.random() * 35;
    const br = (Math.random() - 0.5) * 16;
    for (let p = 0; p < len; p++) {
      const px = Math.floor(fx + p + (Math.random() - 0.5) * 2);
      const py = Math.floor(fy + (Math.random() - 0.5) * 1.5);
      if (px >= 0 && px < w && py >= 0 && py < h) {
        const idx = (py * w + px) * 4;
        d[idx] += br; d[idx+1] += br; d[idx+2] += br;
      }
    }
  }
  for (let b = 0; b < 45; b++) {
    const bx = Math.random() * w, by = Math.random() * h;
    const bR = 12 + Math.random() * 36;
    const bBr = (Math.random() - 0.5) * 9;
    for (let dy = -bR; dy < bR; dy++) {
      for (let dx = -bR; dx < bR; dx++) {
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < bR) {
          const px = Math.floor(bx + dx), py = Math.floor(by + dy);
          if (px >= 0 && px < w && py >= 0 && py < h) {
            const falloff = 1 - dist / bR;
            const idx = (py * w + px) * 4;
            const v = bBr * falloff * falloff;
            d[idx] += v; d[idx+1] += v; d[idx+2] += v;
          }
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- v2 的 2D 蠟封（備援視覺） ----------
function makeWaxSeal2D() {
  const c = document.getElementById('sealTex');
  const size = 200;
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const cx = size/2, cy = size/2, r = size/2;
  const base = ctx.createRadialGradient(cx - r*0.3, cy - r*0.35, r*0.05, cx + r*0.1, cy + r*0.2, r*1.1);
  base.addColorStop(0,    '#e6cabf');
  base.addColorStop(0.35, '#dabbb0');
  base.addColorStop(0.70, '#caa89c');
  base.addColorStop(0.90, '#bd998a');
  base.addColorStop(1,    '#ae8b79');
  ctx.fillStyle = base;
  ctx.beginPath();

// ---------- 立即初始化備援視覺 ----------
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const VW = window.innerWidth, VH = window.innerHeight;
makePaperTexture(document.getElementById('envTex'),  Math.ceil(VW * dpr), Math.ceil(VH * dpr), 223, 197, 191);
makePaperTexture(document.getElementById('flapTex'), Math.ceil(VW * dpr), Math.ceil(VH * dpr), 231, 208, 202);
makeWaxSeal2D();

// ---------- 互動（WebGL 層透過事件掛上來，失敗也不影響這裡） ----------
const scene = document.getElementById('scene');
const seal  = document.getElementById('seal');

function openEnvelope() {
  if (scene.classList.contains('opening')) return;
  scene.classList.add('opening');
  window.__envOpenT0 = performance.now();
  window.dispatchEvent(new CustomEvent('env:open'));
}
window.openEnvelope = openEnvelope;

function resetScene() {
  scene.classList.remove('opening');
  window.__envOpenT0 = null;
  window.dispatchEvent(new CustomEvent('env:reset'));
}
window.resetScene = resetScene;
document.getElementById('resetBtn').addEventListener('click', resetScene);

seal.addEventListener('click', e => {
  e.stopPropagation();
  openEnvelope();
});

// ---------- Test hooks ----------
// ?auto — 自動開啟；?seek=N — 開啟並把 CSS 動畫（與 WebGL 光照）定格在第 N 毫秒
const params = new URLSearchParams(location.search);
const seekMs = parseFloat(params.get('seek') || params.get('freeze') || '0');
const autoOpen = params.has('auto') || seekMs > 0;

if (autoOpen) setTimeout(() => openEnvelope(), 60);
if (seekMs > 0) {
  setTimeout(() => {
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = seekMs; });
    window.__envSeekMs = seekMs;
    window.dispatchEvent(new CustomEvent('env:seek', { detail: seekMs }));
  }, 140);
}

  const LIGHT = [0.25, 0.35, 0.905];

  // 確定性 PRNG（測試抽格需要每次載入結果一致）
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

attribute vec2 position;
attribute vec2 uv;
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position, 0.0, 1.0); }
`;

  const PAPER_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uNormalMap;
uniform sampler2D uColorMap;
uniform vec3 uTint;
uniform vec2 uTile;
uniform float uNormalScale;
uniform vec3 uLight;
uniform float uAngle;
uniform float uGain;
void main() {
  vec2 tuv = vUv * uTile;
  vec3 mapN = texture2D(uNormalMap, tuv).rgb * 2.0 - 1.0;
  vec3 N = normalize(mix(vec3(0.0, 0.0, 1.0), mapN, uNormalScale));
  float c = cos(uAngle), s = sin(uAngle);
  N = normalize(vec3(N.x, N.y * c + N.z * s, -N.y * s + N.z * c));

  float wrap = max((dot(N, L) + 0.35) / 1.35, 0.0);
  float lum = mix(diff, wrap, 0.55);
  float fleck = dot(texture2D(uColorMap, tuv).rgb, vec3(0.333));
  float fleckVar = 1.0 + (fleck - 0.82) * 0.15;
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 H = normalize(L + V);
  float spec = pow(max(dot(N, H), 0.0), 14.0) * 0.10 * smoothstep(0.0, 0.5, uAngle);
  vec3 col = uTint * (0.70 + 0.36 * lum) * fleckVar * uGain + vec3(spec);
  gl_FragColor = vec4(col, 1.0);
}
`;

  // 蠟封／壓痕：高度圖轉出的法線 + albedo + Blinn-Phong（霧面蠟高光）
  const RELIEF_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uNormalMap;
uniform sampler2D uAlbedo;
uniform vec3 uLight;
uniform float uSpecStr;
uniform float uShininess;
uniform float uDiffStr;
uniform float uBaseLight;
void main() {
  vec4 nm = texture2D(uNormalMap, vUv);
  float mask = nm.a;
  if (mask < 0.004) { gl_FragColor = vec4(0.0); return; }
  vec3 N = normalize(nm.rgb * 2.0 - 1.0);
  vec3 L = normalize(uLight);
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 H = normalize(L + V);
  float wrap = max((dot(N, L) + 0.30) / 1.30, 0.0);
  float spec = pow(max(dot(N, H), 0.0), uShininess) * uSpecStr;
  vec3 base = texture2D(uAlbedo, vUv).rgb;
  vec3 col = base * (uBaseLight + uDiffStr * wrap) + vec3(1.0, 0.96, 0.90) * spec;
  gl_FragColor = vec4(col * mask, mask);
}
`;

  // ---------------- 烘焙用 renderer（隱藏 offscreen，共用一個 context） ----------------
  const bakeRenderer = new Renderer({ dpr: 1, alpha: true, premultipliedAlpha: true });
  const bgl = bakeRenderer.gl;
  if (!bgl) throw new Error('WebGL context unavailable');

  function bake(w, h, frag, uniforms, targetCanvas) {
    bakeRenderer.setSize(w, h);
    const program = new Program(bgl, { vertex: VERT, fragment: frag, uniforms, transparent: true });
    const mesh = new Mesh(bgl, { geometry: new Triangle(bgl), program });
    bakeRenderer.render({ scene: mesh });
    targetCanvas.width = w; targetCanvas.height = h;
    const ctx = targetCanvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(bgl.canvas, 0, 0, w, h);
  }

  function loadImage(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = src;
    });
  }

  // ---------------- 蠟封高度圖 → 法線貼圖 ----------------
  function valueNoise(rand, size, freq) {
    const g = Math.ceil(freq) + 2;
    const grid = new Float32Array(g * g);
    for (let i = 0; i < grid.length; i++) grid[i] = rand();
    const out = new Float32Array(size * size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const fx = x / size * freq, fy = y / size * freq;
        const x0 = Math.floor(fx), y0 = Math.floor(fy);
        const tx = fx - x0, ty = fy - y0;
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        const a = grid[y0 * g + x0], b = grid[y0 * g + x0 + 1];
        const c2 = grid[(y0 + 1) * g + x0], d2 = grid[(y0 + 1) * g + x0 + 1];
        out[y * size + x] = a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d2) * sx * sy;
      }
    }
    return out;
  }

  async function buildSealHeight(size, { dome = 1, rim = 1, text = 1, noiseAmp = 1 } = {}) {
    const rand = mulberry32(20260712);
    const n1 = valueNoise(rand, size, 5);
    const n2 = valueNoise(rand, size, 11);
    const n3 = valueNoise(rand, size, 23);

    // 文字 alpha（Italianno）— 輪詢 check() 直到字型可用（上限 3s，逾時 fallback）
    const fontSpec = `${Math.round(size * 0.34)}px Italianno`;
    for (let i = 0; i < 30 && !document.fonts.check(fontSpec); i++) {
      await document.fonts.load(fontSpec).catch(() => {});
      if (!document.fonts.check(fontSpec)) await new Promise(r => setTimeout(r, 100));
    }
    const tc = document.createElement('canvas');
    tc.width = tc.height = size;
    const tctx = tc.getContext('2d');
    tctx.fillStyle = '#fff';
    tctx.font = `${Math.round(size * 0.34)}px Italianno, cursive`;
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    tctx.filter = 'blur(2.2px)';   // 蠟的壓印邊緣是圓的，不是刀切
    tctx.fillText('M & J', size / 2, size * 0.52);
    const textA = tctx.getImageData(0, 0, size, size).data;

    const h = new Float32Array(size * size);
    const maskArr = new Float32Array(size * size);
    const cx = size / 2, cy = size / 2, R = size * 0.475;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i = y * size + x;
        const dx = (x - cx) / R, dy = (y - cy) / R;
        const ang = Math.atan2(dy, dx);
        const wobble = 1
          + 0.030 * Math.sin(ang * 3 + 0.7)
          + 0.022 * Math.sin(ang * 5 - 1.3)
          + 0.014 * Math.sin(ang * 8 + 2.1);
        const d = Math.sqrt(dx * dx + dy * dy) / wobble;
        if (d > 1.04) { h[i] = 0; maskArr[i] = 0; continue; }
        const edge = 1 - Math.min(Math.max((d - 0.965) / 0.075, 0), 1);
        maskArr[i] = edge * edge * (3 - 2 * edge);
        // 圓頂 — 原片的蠟餅壓得很扁：平頂維持到 d≈0.8 才塌邊
        let v = dome * 0.30 * Math.pow(Math.max(1 - Math.pow(d, 6.0), 0), 0.38);
        // 細圈線 r≈0.86 貼近邊緣（原片是單一刻環）
        v += rim * 0.13 * Math.exp(-Math.pow((d - 0.86) / 0.030, 2));
        v -= rim * 0.035 * Math.exp(-Math.pow((d - 0.80) / 0.026, 2));
        // 盤面微凹（印章壓平中心）
        v -= rim * 0.028 * (1 - Math.min(Math.max((d - 0.62) / 0.12, 0), 1));
        // 蠟流噪聲（低頻為主）
        v += noiseAmp * (0.050 * (n1[i] - 0.5) + 0.026 * (n2[i] - 0.5) + 0.012 * (n3[i] - 0.5));
        // 文字負浮雕 — 淺刻痕：質感來自法線的亮邊/暗邊，不是深溝
        if (d < 0.74) v -= text * 0.24 * (textA[i * 4] / 255);
        h[i] = v;
      }
    }
    return { h, maskArr };
  }

  function heightToNormalCanvas(h, maskArr, size, strength) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(size, size);
    const d = img.data;
    const at = (x, y) => h[Math.min(Math.max(y, 0), size - 1) * size + Math.min(Math.max(x, 0), size - 1)];
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i = y * size + x;
        const gx = (at(x+1,y-1) + 2*at(x+1,y) + at(x+1,y+1)) - (at(x-1,y-1) + 2*at(x-1,y) + at(x-1,y+1));
        const gy = (at(x-1,y+1) + 2*at(x,y+1) + at(x+1,y+1)) - (at(x-1,y-1) + 2*at(x,y-1) + at(x+1,y-1));
        let nx = -gx * strength, ny = gy * strength, nz = 1;
        const inv = 1 / Math.sqrt(nx*nx + ny*ny + nz*nz);
        nx *= inv; ny *= inv; nz *= inv;
        d[i*4]   = Math.round((nx * 0.5 + 0.5) * 255);
        d[i*4+1] = Math.round((ny * 0.5 + 0.5) * 255);
        d[i*4+2] = Math.round((nz * 0.5 + 0.5) * 255);
        d[i*4+3] = Math.round(maskArr[i] * 255);
      }
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // 蠟封 albedo：裸粉蠟漸層 + 顆粒（與紙同色系、深一階 — 依原片取樣）
  function makeSealAlbedo(size) {
    const rand = mulberry32(8861);
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const cx = size/2, cy = size/2, r = size/2;
    const base = ctx.createRadialGradient(cx - r*0.3, cy - r*0.35, r*0.05, cx + r*0.1, cy + r*0.2, r*1.1);
    base.addColorStop(0,    '#e4c8bc');
    base.addColorStop(0.35, '#dcbcae');
    base.addColorStop(0.70, '#d2b0a2');
    base.addColorStop(0.90, '#c9a597');
    base.addColorStop(1,    '#c09b8c');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, size, size);
    const img = ctx.getImageData(0, 0, size, size);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (rand() - 0.5) * 8, warm = (rand() - 0.5) * 3;
      d[i] += n + warm; d[i+1] += n; d[i+2] += n - warm;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // 壓痕 albedo：紙色（比周圍暗 ~4%）
  function makeImprintAlbedo(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size*0.4, size*0.35, size*0.05, size*0.55, size*0.6, size*0.62);
    g.addColorStop(0, 'rgb(219,192,186)');
    g.addColorStop(1, 'rgb(211,183,177)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return c;
  }

  // ---------------- 初始化 ----------------
  const [normalImg, colorImg] = await Promise.all([
    loadImage('data:image/jpeg;base64,' + PAPER_NORMAL_B64),
    loadImage('data:image/jpeg;base64,' + PAPER_COLOR_B64),
  ]);

  const mkTex = (gl, image, repeat) => new Texture(gl, {
    image,
    wrapS: repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE,
    wrapT: repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE,
    generateMipmaps: true,
  });

  // --- 信封本體：烘焙一次 ---
  const bw = Math.ceil(VW * dpr), bh = Math.ceil(VH * dpr);
  const tile = [VW / 150, VH / 150];  // 纖維約 150px 一循環 — 細顆粒紙感
  bake(bw, bh, PAPER_FRAG, {
    uNormalMap: { value: mkTex(bgl, normalImg, true) },
    uColorMap:  { value: mkTex(bgl, colorImg, true) },
    uTint:      { value: [223/255, 197/255, 191/255] },
    uTile:      { value: tile },
    uNormalScale: { value: 0.16 },
    uLight:     { value: LIGHT },
    uAngle:     { value: 0 },
    uGain:      { value: 1.0 },
  }, document.getElementById('envTex'));

  // --- 蠟封：高度圖 → 法線 → 烘焙 ---
  const S = 512;
  const { h, maskArr } = await buildSealHeight(S, { noiseAmp: 0.55 });
  const sealNormal = heightToNormalCanvas(h, maskArr, S, 21);
  bake(S, S, RELIEF_FRAG, {
    uNormalMap: { value: mkTex(bgl, sealNormal, false) },
    uAlbedo:    { value: mkTex(bgl, makeSealAlbedo(S), false) },
    uLight:     { value: LIGHT },
    uSpecStr:   { value: 0.09 },
    uShininess: { value: 20.0 },
    uDiffStr:   { value: 0.28 },
    uBaseLight: { value: 0.60 },
  }, document.getElementById('sealTex'));

  // --- 壓痕：同一組浮雕但圓頂拿掉、幅度壓低（蠟撕走後紙上的殘痕）---
  const imp = await buildSealHeight(S, { dome: 0.06, rim: 0.42, text: 0.22, noiseAmp: 0.35 });
  const impNormal = heightToNormalCanvas(imp.h, imp.maskArr, S, 9);
  bake(S, S, RELIEF_FRAG, {
    uNormalMap: { value: mkTex(bgl, impNormal, false) },
    uAlbedo:    { value: mkTex(bgl, makeImprintAlbedo(S), false) },
    uLight:     { value: LIGHT },
    uSpecStr:   { value: 0.05 },
    uShininess: { value: 10.0 },
    uDiffStr:   { value: 0.34 },
    uBaseLight: { value: 0.66 },
  }, document.getElementById('imprintTex'));

  // --- 翻蓋：專用 GL canvas（#flapGL），只在開啟動畫期間跑 rAF ---
  const flapRenderer = new Renderer({
    canvas: document.getElementById('flapGL'),
    width: VW, height: VH, dpr, alpha: false,
  });
  const fgl = flapRenderer.gl;
  if (!fgl) throw new Error('flap WebGL context unavailable');
  const flapProgram = new Program(fgl, {
    vertex: VERT,
    fragment: PAPER_FRAG,
    uniforms: {
      uNormalMap: { value: mkTex(fgl, normalImg, true) },
      uColorMap:  { value: mkTex(fgl, colorImg, true) },
      uTint:      { value: [231/255, 208/255, 202/255] },
      uTile:      { value: tile },
      uNormalScale: { value: 0.16 },
      uLight:     { value: LIGHT },
      uAngle:     { value: 0 },
      uGain:      { value: 1.0 },
    },
  });
  const flapMesh = new Mesh(fgl, { geometry: new Triangle(fgl), program: flapProgram });

  function renderFlap(angleRad) {
    flapProgram.uniforms.uAngle.value = angleRad;
    // 面向窗光的能量增益：54° 時約 +30%（其餘交給 flap-light 與 bloom）
    flapProgram.uniforms.uGain.value = 1.0 + 0.55 * Math.sin(angleRad);
    flapRenderer.render({ scene: flapMesh });
  }

  // ---------------- CSS timeline 同步 ----------------
  // flapOpen: cubic-bezier(0.52,0.04,0.55,0.95)、0.62s、delay 0.04s、0→54°
  function cubicBezierEase(p1x, p1y, p2x, p2y) {
    const cx2 = 3 * p1x, bx = 3 * (p2x - p1x) - cx2, ax = 1 - cx2 - bx;
    const cy2 = 3 * p1y, by = 3 * (p2y - p1y) - cy2, ay = 1 - cy2 - by;
    const sampleX = t => ((ax * t + bx) * t + cx2) * t;
    const sampleY = t => ((ay * t + by) * t + cy2) * t;
    return x => {
      let t = x;
      for (let i = 0; i < 6; i++) {
        const err = sampleX(t) - x;
        const dd = (3 * ax * t + 2 * bx) * t + cx2;
        if (Math.abs(dd) < 1e-6) break;
        t -= err / dd;
      }
      return sampleY(Math.min(Math.max(t, 0), 1));
    };
  }
  const flapEase = cubicBezierEase(0.52, 0.04, 0.55, 0.95);
  const FLAP_DELAY = 40, FLAP_DUR = 620, MAX_ANGLE = 54 * Math.PI / 180;
  const flapAngleAt = tMs => MAX_ANGLE * flapEase(Math.min(Math.max((tMs - FLAP_DELAY) / FLAP_DUR, 0), 1));

  let rafId = 0;
  function runFlapLoop(t0) {
    cancelAnimationFrame(rafId);
    const step = () => {
      const t = performance.now() - t0;
      renderFlap(flapAngleAt(t));
      if (t < FLAP_DELAY + FLAP_DUR + 60) rafId = requestAnimationFrame(step);
      // 動畫結束即停 loop — 不常駐燒電
    };
    rafId = requestAnimationFrame(step);
  }

  // ---------------- 掛上互動事件（第一層發出的） ----------------
  window.addEventListener('env:open',  () => runFlapLoop(window.__envOpenT0 || performance.now()));
  window.addEventListener('env:reset', () => { cancelAnimationFrame(rafId); renderFlap(0); });
  window.addEventListener('env:seek',  e => { cancelAnimationFrame(rafId); renderFlap(flapAngleAt(e.detail)); });

  // ---------------- 就緒：切換到 WebGL 視覺 ----------------
  renderFlap(0);
  scene.classList.add('glr');
  document.documentElement.dataset.glReady = '1';

  // 若開啟/定格發生在初始化完成之前（?auto / ?seek 提早觸發），補上對應狀態
  if (window.__envSeekMs) renderFlap(flapAngleAt(window.__envSeekMs));
  else if (scene.classList.contains('opening') && window.__envOpenT0) runFlapLoop(window.__envOpenT0);

} catch (err) {
  console.warn('[cinematic-envelope v3] WebGL 增強層失敗，維持 2D 備援視覺：', err);
}
})();
</script>
</body>
</html>
